symbolPreset: nerd
composer:
  shape: pi
theme:
  dark: mire
  light: light
setupVersion: 2
statusLine:
  preset: custom
  separator: none
  transparent: true
  compactThinkingLevel: false
  leftSegments:
    - model
    - cost
    - cache_hit
    - token_in
    - token_out
  rightSegments:
    - path
    - git
    - session_name
  segmentOptions:
    path:
      abbreviate: true
      maxLength: 80
      stripWorkPrefix: false
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
    model:
      showThinkingLevel: true
hideThinkingBlock: true
display:
  hideToolActivity: false
vault:
  enabled: false