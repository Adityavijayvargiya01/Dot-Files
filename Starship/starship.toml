format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[character]
success_symbol = "[](bold green)"
error_symbol = "[](bold red)"
vimcmd_symbol = "[](bold cyan)"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[git_branch]
format = "[$branch]($style) "
style = "blue"

[git_status]
format = "[$all_status]($style)"
style = "green"

[python]
format = "[$virtualenv]($style) "
style = "magenta"
